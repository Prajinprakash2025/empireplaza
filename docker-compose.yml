version: '3.8'

services:
  web:
    build: .
    container_name: empire_plaza_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=empire_plaza_local_key
      - ALLOWED_HOSTS=localhost,127.0.0.1,web